<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact AITU Football Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">AITU FC</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="matches.html">Matches</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-section">
      <h1>Join the Team</h1>
      <p>Send us your details and we will contact you about football tryouts.</p>

      <div id="form-alert" class="alert" style="display: none;"></div>

      <form id="registration-form" novalidate>
        <div class="mb-3">
          <label for="player-name">Your Name</label>
          <input class="form-control" type="text" id="player-name" name="player-name" required>
          <div class="invalid-feedback" id="name-error"></div>
          <div class="valid-feedback" id="name-valid"></div>
        </div>

        <div class="mb-3">
          <label for="player-email">Email Address</label>
          <input class="form-control" type="email" id="player-email" name="player-email" required>
          <div class="invalid-feedback" id="email-error"></div>
          <div class="valid-feedback" id="email-valid"></div>
        </div>

        <div class="mb-3">
          <label for="player-password">Password</label>
          <input class="form-control" type="password" id="player-password" name="player-password" minlength="6" required>
          <div class="invalid-feedback" id="password-error"></div>
          <div class="valid-feedback" id="password-valid"></div>
          <div class="strength-meter-wrapper" id="password-strength-wrapper">
            <div id="password-strength-bar"></div>
          </div>
          <small id="password-strength-text"></small>
        </div>

        <div class="mb-3">
          <label for="player-confirm-password">Confirm Password</label>
          <input class="form-control" type="password" id="player-confirm-password" name="player-confirm-password" required>
          <div class="invalid-feedback" id="confirm-error"></div>
          <div class="valid-feedback" id="confirm-valid"></div>
        </div>

        <div class="mb-3">
          <label for="player-message">Message</label>
          <textarea class="form-control" id="player-message" name="player-message" rows="3" required></textarea>
          <div class="invalid-feedback" id="message-error"></div>
          <div class="valid-feedback" id="message-valid"></div>
        </div>

        <button class="form-button" type="button" id="submit-btn">Send</button>
      </form>
    </div>
  </main>

  <footer>
    <p>AITU Football Club</p>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="matches.html">Matches</a>
      <a href="gallery.html">Gallery</a>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
