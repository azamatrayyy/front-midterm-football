<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact AITU Football Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">AITU FC</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="matches.html">Matches</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-section">
      <h1>Join the Team</h1>
      <p>Send us your details and we will contact you about football tryouts.</p>
      <form>
        <div class="mb-3">
          <label for="player-name">Your Name</label>
          <input class="form-control" type="text" id="player-name" name="player-name">
        </div>
        <div class="mb-3">
          <label for="player-email">Email Address</label>
          <input class="form-control" type="email" id="player-email" name="player-email">
        </div>
        <button class="form-button" type="submit">Send</button>
      </form>
    </div>
  </main>

  <footer>
    <p>AITU Football Club</p>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="matches.html">Matches</a>
      <a href="gallery.html">Gallery</a>
    </div>
  </footer>
</body>
</html>
