<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Schedule - AITU Football Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">AITU FC</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="matches.html">Matches</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      <h1>Match Schedule</h1>

      <div class="crud-form-box mb-4">
        <h3 id="crud-form-title">Add New Match</h3>
        <div id="crud-alert" class="alert" style="display: none;"></div>
        <form id="crud-form" class="row g-2" novalidate>
          <div class="col-md-2">
            <input type="text" id="match-date" class="form-control" placeholder="Date (e.g. Oct 31)" required>
          </div>
          <div class="col-md-3">
            <input type="text" id="match-teams" class="form-control" placeholder="Match (e.g. AITU FC vs. NU)" required>
          </div>
          <div class="col-md-2">
            <select id="match-category" class="form-select" required>
              <option value="Friendly">Friendly</option>
              <option value="League">League</option>
              <option value="Cup">Cup</option>
            </select>
          </div>
          <div class="col-md-3">
            <input type="text" id="match-location" class="form-control" placeholder="Location" required>
          </div>
          <div class="col-md-2">
            <input type="text" id="match-time" class="form-control" placeholder="Time (e.g. 4:00 PM)" required>
          </div>
          <div class="col-12 mt-2">
            <button type="button" id="save-match-btn" class="form-button">Add Match</button>
            <button type="button" id="cancel-edit-btn" class="category-btn" style="display: none;">Cancel</button>
          </div>
        </form>
      </div>

      <div class="filter-controls mb-3">
        <input type="text" id="match-search" class="form-control mb-2" placeholder="Search by date, match, category, location, or time...">
        <div class="category-buttons">
          <button type="button" class="category-btn active-category">All</button>
          <button type="button" class="category-btn">Friendly</button>
          <button type="button" class="category-btn">League</button>
          <button type="button" class="category-btn">Cup</button>
        </div>
      </div>

      <table class="table" id="matches-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Match</th>
            <th>Category</th>
            <th>Location</th>
            <th>Time</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="matches-tbody"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>AITU Football Club</p>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
